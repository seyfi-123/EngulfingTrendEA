<script>
// ============================================================
// SOZLAMALAR
// ============================================================
const CFG = { sym: 'BTCUSDT', tf: '5m', mo: 3 };
const TP1_PCT = 0.15;       // 15% 1:1 da yopiladi

function getBal(){ return parseFloat(document.getElementById('balInput').value) || 1000; }
function getSLBuf(){ return parseFloat(document.getElementById('slBufInput').value) || 10; }
function getLotStart(){ return parseFloat(document.getElementById('lotStart').value) || 0.05; }
function getLotCap(){ return parseFloat(document.getElementById('lotCap').value) || 0.50; }
function getCool(){ return parseInt(document.getElementById('coolInput').value) || 5; }
function getCommRate(){
  if(!document.getElementById('commOn').checked) return 0;
  return (parseFloat(document.getElementById('commInput').value) || 5) / 10000;
}

let chart, series;

function S(el, type, val){
  el.parentNode.querySelectorAll('.b').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  if(type === 's') CFG.sym = val;
  if(type === 't') CFG.tf = val;
  load();
}

function initChart(){
  const el = document.getElementById('ch');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight,
    layout: { background: { color: '#0a0b0f' }, textColor: '#cbd5e1', fontSize: 10 },
    grid: { vertLines: { color: '#ffffff0a' }, horzLines: { color: '#ffffff0a' } },
    rightPriceScale: { borderColor: '#ffffff14' },
    timeScale: { borderColor: '#ffffff14', timeVisible: true }
  });
  series = chart.addCandlestickSeries({
    upColor: '#10b981', downColor: '#ef4444',
    borderUpColor: '#10b981', borderDownColor: '#ef4444',
    wickUpColor: '#10b981', wickDownColor: '#ef4444'
  });
  window.addEventListener('resize', () => {
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  });
}

async function fetchCandles(){
  let all = [];
  let cur = Date.now() - CFG.mo * 30 * 24 * 3600 * 1000;
  let guard = 0;
  while(cur < Date.now() && guard < 200){
    guard++;
    try {
      const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${CFG.sym}&interval=${CFG.tf}&startTime=${cur}&limit=1000`);
      const d = await r.json();
      if(!d.length) break;
      all = all.concat(d.map(x => ({
        time: Math.floor(x[0]/1000), open: +x[1], high: +x[2], low: +x[3], close: +x[4]
      })));
      document.getElementById('ld').textContent = 'Yuklanmoqda... ' + all.length + ' sham';
      cur = d[d.length-1][0] + 1;
      if(d.length < 1000) break;
    } catch(e){ break; }
  }
  const seen = new Set();
  return all.filter(x => !seen.has(x.time) && seen.add(x.time));
}

// ============================================================
// TRADE ENGINE — COMMISSION AWARE
// ============================================================
class TradeEngine {
  constructor(initialBalance, lotStart, lotCap, slBuf){
    this.balance = initialBalance;
    this.initialBalance = initialBalance;
    this.lotStart = lotStart;
    this.lotCap = lotCap;
    this.slBuf = slBuf;
    this.commRate = getCommRate();
    this.currentLot = lotStart;
    this.completedTrades = 0;
    this.trades = [];
    this.pos = null;
    this.wins = 0;
    this.losses = 0;
    this.bes = 0;
    this.trailSteps = 0;
    this.tp1Hits = 0;
    this.totalCommission = 0;
    this.totalGross = 0;
    this.lastLossIdx = -999;
  }

  updateLot(){
    const bonus = Math.floor(this.completedTrades / 10) * 0.05;
    this.currentLot = Math.min(this.lotStart + bonus, this.lotCap);
  }

  checkEngulfing(cd, idx){
    if(idx < 2) return null;
    const cur = cd[idx];
    const p1 = cd[idx - 1];
    const p2 = cd[idx - 2];

    const bull1 = cur.close > cur.open &&
                  p1.close < p1.open &&
                  cur.open <= p1.close && cur.close >= p1.open;
    const bear1 = cur.close < cur.open &&
                  p1.close > p1.open &&
                  cur.open >= p1.close && cur.close <= p1.open;

    const maxHigh2 = Math.max(p1.high, p2.high);
    const minLow2  = Math.min(p1.low, p2.low);
    const bull2 = cur.close > cur.open &&
                  p1.close < p1.open && p2.close < p2.open &&
                  cur.low <= minLow2 && cur.close > maxHigh2;
    const bear2 = cur.close < cur.open &&
                  p1.close > p1.open && p2.close > p2.open &&
                  cur.high >= maxHigh2 && cur.close < minLow2;

    if(bull1 || bull2) return { type: 'B', candles: bull2 ? 2 : 1 };
    if(bear1 || bear2) return { type: 'S', candles: bear2 ? 2 : 1 };
    return null;
  }

  manageTrade(candle){
    const p = this.pos;
    if(!p) return;

    // ---- SL tegilganini tekshirish ----
    let exit = 0, exitR = 0, closed = false;
    if(p.type === 'B' && candle.low <= p.sl){
      exit = p.sl;
      exitR = (exit - p.entry) / p.slDist;
      closed = true;
    } else if(p.type === 'S' && candle.high >= p.sl){
      exit = p.sl;
      exitR = (p.entry - exit) / p.slDist;
      closed = true;
    }

    if(closed){
      // ========== YOPILISH ==========
      // Gross foyda (qolgan qism)
      const grossPnl = exitR * p.riskPerR * p.qty;

      // Yopilish komissiyasi (qolgan qism)
      const closeSize = this.currentLot * p.qty;   // BTC hajmi
      const closeComm = closeSize * exit * this.commRate;

      // Net foyda
      const netPnl = grossPnl - closeComm;

      p.commission += closeComm;
      p.gross += grossPnl;
      p.pnl += netPnl;
      p.exit = exit;
      p.exitR = exitR;
      p.manualClose = false;

      // Balance yangilash
      this.balance += netPnl;
      this.totalCommission += closeComm;
      this.totalGross += grossPnl;

      if(p.pnl > 0.01){ p.result = 'W'; this.wins++; }
      else if(p.pnl < -0.01){
        p.result = 'L'; this.losses++;
        this.lastLossIdx = p.openIdx;
      } else { p.result = 'BE'; this.bes++; }

      this.completedTrades++;
      this.trades.push(p);
      this.pos = null;
      this.updateLot();
      return;
    }

    // ---- Max R hisoblash ----
    let maxR;
    if(p.type === 'B') maxR = (candle.high - p.entry) / p.slDist;
    else maxR = (p.entry - candle.low) / p.slDist;

    // ========== TP1: 15% da yopiladi ==========
    if(maxR >= 1 && !p.tp1Done){
      p.tp1Done = true;
      this.tp1Hits++;

      // TP1 exit narxi = 1:1
      const tp1Exit = p.type === 'B' ? p.entry + p.slDist : p.entry - p.slDist;

      // TP1 gross foyda = 0.15R
      const tp1Gross = 1.0 * p.riskPerR * TP1_PCT;

      // TP1 komissiya (15% hajm)
      const tp1Size = this.currentLot * TP1_PCT;
      const tp1Comm = tp1Size * tp1Exit * this.commRate;

      // TP1 net foyda
      const tp1Net = tp1Gross - tp1Comm;

      p.pnl += tp1Net;
      p.gross += tp1Gross;
      p.commission += tp1Comm;

      // Balance yangilash
      this.balance += tp1Net;
      this.totalCommission += tp1Comm;
      this.totalGross += tp1Gross;

      // Qolgan 85%
      p.qty = 1 - TP1_PCT;

      // Qolgan qism uchun SL = entry (BE)
      p.sl = p.entry;
      p.beSet = true;
    }

    // ========== QOLGAN 85% TRAILING ==========
    if(p.tp1Done && p.qty > 0){
      if(maxR >= 1){
        const lockR = Math.floor(maxR) - 1;
        if(lockR >= 0){
          let newSL;
          if(p.type === 'B'){
            newSL = p.entry + lockR * p.slDist;
            if(newSL > p.sl){
              p.sl = newSL;
              p.lockR = lockR;
              this.trailSteps++;
            }
          } else {
            newSL = p.entry - lockR * p.slDist;
            if(newSL < p.sl){
              p.sl = newSL;
              p.lockR = lockR;
              this.trailSteps++;
            }
          }
        }
      }
    }
  }

  openTrade(signal, candle, idx){
    const cur = candle;
    const buf = this.slBuf * (cur.close / 100000);

    let slPrice, slDist;
    if(signal.type === 'B'){
      slPrice = cur.low - buf;
      slDist = cur.close - slPrice;
    } else {
      slPrice = cur.high + buf;
      slDist = slPrice - cur.close;
    }
    if(slDist <= 0) return;

    const riskPerR = this.currentLot * 100;

    // ========== OCHILISH KOMISSIYASI ==========
    const openSize = this.currentLot;
    const openComm = openSize * cur.close * this.commRate;

    // Balance dan darhol chegirish
    this.balance -= openComm;
    this.totalCommission += openComm;

    this.pos = {
      time: cur.time,
      openIdx: idx,
      type: signal.type,
      engulfCandles: signal.candles,
      entry: cur.close,
      sl: slPrice,
      initialSL: slPrice,
      slDist,
      lot: this.currentLot,
      riskPerR,
      pnl: 0,
      gross: 0,
      commission: openComm,
      qty: 1.0,
      tp1Done: false,
      tp1Pnl: 0,
      beSet: false,
      lockR: -1
    };
  }

  forceClose(lastCandle){
    const p = this.pos;
    if(!p) return;
    const exit = lastCandle.close;
    let exitR;
    if(p.type === 'B') exitR = (exit - p.entry) / p.slDist;
    else exitR = (p.entry - exit) / p.slDist;

    const grossPnl = exitR * p.riskPerR * p.qty;
    const closeSize = this.currentLot * p.qty;
    const closeComm = closeSize * exit * this.commRate;
    const netPnl = grossPnl - closeComm;

    p.gross += grossPnl;
    p.commission += closeComm;
    p.pnl += netPnl;
    p.exit = exit;
    p.exitR = exitR;
    p.manualClose = true;

    this.balance += netPnl;
    this.totalCommission += closeComm;
    this.totalGross += grossPnl;

    if(p.pnl > 0.01){ p.result = 'W'; this.wins++; }
    else if(p.pnl < -0.01){ p.result = 'L'; this.losses++; }
    else { p.result = 'BE'; this.bes++; }
    this.trades.push(p);
    this.pos = null;
  }

  run(cd){
    const cooldown = getCool();

    for(let i = 2; i < cd.length; i++){
      if(this.pos) this.manageTrade(cd[i]);
      if(this.pos) continue;

      const idx = i - 1;
      if(idx - this.lastLossIdx < cooldown) continue;

      const signal = this.checkEngulfing(cd, idx);
      if(!signal) continue;

      this.openTrade(signal, cd[idx], idx);
    }

    this.forceClose(cd[cd.length - 1]);

    return {
      trades: this.trades,
      wins: this.wins,
      losses: this.losses,
      bes: this.bes,
      trailSteps: this.trailSteps,
      tp1Hits: this.tp1Hits,
      totalCommission: this.totalCommission,
      totalGross: this.totalGross,
      finalBalance: this.balance,
      initialBalance: this.initialBalance
    };
  }
}

function calcTrades(cd){
  const engine = new TradeEngine(getBal(), getLotStart(), getLotCap(), getSLBuf());
  return engine.run(cd);
}

function stats(result){
  const trades = result.trades;
  let netTotal = 0, w = 0, l = 0, be = 0, gw = 0, gl = 0;

  trades.forEach(t => {
    netTotal += t.pnl;
    if(t.result === 'W'){ w++; gw += t.pnl; }
    else if(t.result === 'L'){ l++; gl += Math.abs(t.pnl); }
    else be++;
  });

  const closed = w + l + be;
  const wr = closed > 0 ? w / closed * 100 : 0;
  const pf = gl > 0 ? gw / gl : 0;

  const P = document.getElementById('pnl');
  P.textContent = (netTotal >= 0 ? '+' : '') + netTotal.toFixed(2) + '$';
  P.className = netTotal > 0 ? 'g' : netTotal < 0 ? 'r2' : '';

  const W = document.getElementById('wr');
  W.textContent = wr.toFixed(1) + '%';
  W.className = wr >= 50 ? 'g' : wr > 0 ? 'r2' : '';
  document.getElementById('wrSub').textContent = w + 'W / ' + l + 'L';

  document.getElementById('w').textContent = w;
  document.getElementById('l').textContent = l;
  document.getElementById('pf').textContent = pf.toFixed(2);
  document.getElementById('tt').textContent = closed;

  // Gross va Commission
  const gross = result.totalGross;
  const comm = result.totalCommission;
  document.getElementById('gross').textContent = (gross >= 0 ? '+' : '') + gross.toFixed(0) + '$';
  document.getElementById('gross').className = gross > 0 ? 'g' : 'r2';
  document.getElementById('comm').textContent = '-' + comm.toFixed(0) + '$';

  document.getElementById('lc').textContent = trades.length;

  const L = document.getElementById('lst');
  if(!trades.length){
    L.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8">Signal yo\'q</div>';
    return;
  }

  L.innerHTML = trades.slice(-40).reverse().map(t => {
    const d = new Date(t.time * 1000);
    const ts = String(d.getDate()).padStart(2,'0') + '.' +
               String(d.getMonth()+1).padStart(2,'0') + ' ' +
               String(d.getHours()).padStart(2,'0') + ':' +
               String(d.getMinutes()).padStart(2,'0');
    const fmt = v => v < 1 ? v.toFixed(4) : v < 100 ? v.toFixed(2) : v.toFixed(0);
    const rc = t.result === 'W' ? 'w' : t.result === 'L' ? 'l' : 'be';
    const rt = (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(1) + '$';

    const engBadge = t.engulfCandles === 2
      ? '<span class="badge b-2c">2C</span>'
      : '<span class="badge b-1c">1C</span>';
    const tp1Badge = t.tp1Done ? '<span class="badge b-tp1">TP1</span>' : '';
    const beBadge = t.beSet ? '<span class="badge b-be">BE</span>' : '';
    const lockBadge = t.lockR > 0 ? `<span class="badge b-tr">+${t.lockR}R</span>` : '';
    const commBadge = `<span class="badge b-comm">-${t.commission.toFixed(1)}$</span>`;

    const grossTxt = `gross ${t.gross >= 0 ? '+' : ''}${t.gross.toFixed(1)}$`;
    const qtyInfo = t.tp1Done && t.qty < 1 ? ` · ${Math.round(t.qty * 100)}%` : '';

    return `<div class="li">
      <span class="t">${ts}</span>
      <span class="sb ${t.type === 'B' ? 'b' : 's'}">${t.type === 'B' ? 'BUY' : 'SELL'}</span>
      <span class="p">
        <span class="line1">@${fmt(t.entry)} <span class="badge b-lot">${t.lot.toFixed(2)}</span>${engBadge}${tp1Badge}${beBadge}${lockBadge}${commBadge}</span>
        <span class="line2">${grossTxt}${qtyInfo}</span>
      </span>
      <span class="rr ${rc}">${rt}</span>
    </div>`;
  }).join('');
}

async function load(){
  const ld = document.getElementById('ld');
  const st = document.getElementById('st');
  ld.classList.remove('x');
  ld.textContent = 'Yuklanmoqda...';
  st.textContent = '...';

  try {
    const cd = await fetchCandles();
    if(!cd.length) throw new Error('Ma\'lumot yo\'q');
    series.setData(cd);

    const result = calcTrades(cd);

    const markers = result.trades.map(t => ({
      time: t.time,
      position: t.type === 'B' ? 'belowBar' : 'aboveBar',
      color: t.result === 'W' ? '#10b981' : t.result === 'L' ? '#ef4444' : '#f59e0b',
      shape: t.type === 'B' ? 'arrowUp' : 'arrowDown',
      text: t.type === 'B' ? 'BUY' : 'SELL'
    }));
    series.setMarkers(markers);

    stats(result);
    chart.timeScale().fitContent();
    ld.classList.add('x');
    st.textContent = '✅ ' + CFG.sym + ' ' + CFG.tf + ' · ' + result.trades.length + ' savdo · Komissiya: -$' + result.totalCommission.toFixed(0);
  } catch(e){
    ld.textContent = '⚠️ ' + e.message;
    st.textContent = 'Xato';
  }
}

initChart();
load();
</script>
</body>
</html>
