<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Engulfing</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0b0f;color:#e2e8f0}
.h{padding:10px 14px;background:#131620;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}
.h b{font-size:13px}
.st{font-size:10px;padding:4px 10px;border-radius:10px;background:#10b98122;color:#6ee7b7}
.c{padding:8px 12px;background:#131620;border-bottom:1px solid #ffffff14;display:flex;gap:5px;overflow-x:auto}
.c::-webkit-scrollbar{display:none}
.b{padding:6px 12px;background:#1a1e2e;border:1px solid #ffffff1f;border-radius:6px;font-size:11px;color:#94a3b8;font-weight:600;cursor:pointer;white-space:nowrap}
.b.on{background:#334155;color:#fff;border-color:#94a3b8}
#ch{height:60vh;background:#0a0b0f;position:relative}
.ld{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#0a0b0fee;font-size:12px;color:#94a3b8}
.ld.x{display:none}
.s{padding:14px;background:#131620}
.r{display:flex;gap:10px;margin-bottom:10px}
.k{flex:1;padding:12px;background:#1a1e2e;border-radius:10px;text-align:center}
.k i{font-size:9px;color:#94a3b8;text-transform:uppercase;font-style:normal;display:block;margin-bottom:4px}
.k b{font-size:22px;font-weight:700}
.g{color:#6ee7b7}.r2{color:#fca5a5}
.m{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.m div{padding:8px;background:#1a1e2e;border-radius:8px;text-align:center;font-size:10px;color:#94a3b8}
.m div b{display:block;font-size:14px;color:#e2e8f0;margin-top:3px}
.hd{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px}
.lst{max-height:200px;overflow-y:auto;background:#1a1e2e;border-radius:8px}
.lst::-webkit-scrollbar{width:3px}
.lst::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:2px}
.li{display:grid;grid-template-columns:60px 40px 1fr 70px;gap:6px;padding:8px;border-bottom:1px solid #ffffff0d;font-family:monospace;font-size:10px;align-items:center}
.li:last-child{border:0}
.li .t{color:#94a3b8}
.sb{font-weight:700;padding:2px 5px;border-radius:4px;text-align:center;font-size:8px}
.sb.b{background:#10b98133;color:#6ee7b7}
.sb.s{background:#ef444433;color:#fca5a5}
.li .p{color:#cbd5e1}
.li .rr{text-align:right;font-weight:700}
.li .rr.w{color:#6ee7b7}.li .rr.l{color:#fca5a5}
</style>
</head>
<body>

<div class="h"><b>🎯 Engulfing</b><div class="st" id="st">...</div></div>

<div class="c">
<div class="b on" onclick="S(this,'s','BTCUSDT')">BTC</div>
<div class="b" onclick="S(this,'s','ETHUSDT')">ETH</div>
<div class="b" onclick="S(this,'s','BNBUSDT')">BNB</div>
<div class="b" onclick="S(this,'s','SOLUSDT')">SOL</div>
<div class="b" onclick="S(this,'s','XRPUSDT')">XRP</div>
<div style="width:1px;background:#ffffff1f;margin:0 4px"></div>
<div class="b" onclick="S(this,'t','5m')">M5</div>
<div class="b on" onclick="S(this,'t','15m')">M15</div>
<div class="b" onclick="S(this,'t','1h')">H1</div>
<div style="width:1px;background:#ffffff1f;margin:0 4px"></div>
<div class="b" onclick="S(this,'m',1)">1oy</div>
<div class="b on" onclick="S(this,'m',6)">6oy</div>
</div>

<div id="ch"><div class="ld" id="ld">Yuklanmoqda...</div></div>

<div class="s">
<div class="r">
<div class="k"><i>💰 P&L</i><b id="pnl">0</b></div>
<div class="k"><i>🎯 Win Rate</i><b id="wr">0%</b></div>
</div>
<div class="m">
<div>✅ Win<b id="w">0</b></div>
<div>❌ Loss<b id="l">0</b></div>
<div>📈 PF<b id="pf">0</b></div>
<div>📊 Jami<b id="tt">0</b></div>
</div>
<div class="hd"><span>📋 Savdolar</span><span id="lc">0</span></div>
<div class="lst" id="lst"><div style="padding:20px;text-align:center;color:#94a3b8">Kutilmoqda...</div></div>
</div>

<script>
// ============================================================
// SOZLAMALAR
// ============================================================
const CFG = {
  sym: 'BTCUSDT',
  tf: '15m',
  mo: 6,
  risk: 2,
  bal: 1000,
  slBuf: 10
};

let chart, series;

// ============================================================
// TUGMA
// ============================================================
function S(el, type, val){
  el.parentNode.querySelectorAll('.b').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  if(type === 's') CFG.sym = val;
  if(type === 't') CFG.tf = val;
  if(type === 'm') CFG.mo = val;
  load();
}

// ============================================================
// CHART YARATISH
// ============================================================
function initChart(){
  const el = document.getElementById('ch');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: el.clientHeight,
    layout: { background: { color: '#0a0b0f' }, textColor: '#cbd5e1', fontSize: 10 },
    grid: { vertLines: { color: '#ffffff0a' }, horzLines: { color: '#ffffff0a' } },
    rightPriceScale: { borderColor: '#ffffff14' },
    timeScale: { borderColor: '#ffffff14', timeVisible: true }
  });
  series = chart.addCandlestickSeries({
    upColor: '#10b981', downColor: '#ef4444',
    borderUpColor: '#10b981', borderDownColor: '#ef4444',
    wickUpColor: '#10b981', wickDownColor: '#ef4444'
  });
  window.addEventListener('resize', () => {
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  });
}

// ============================================================
// MA'LUMOT YUKLASH (Binance)
// ============================================================
async function fetchCandles(){
  let all = [];
  let cur = Date.now() - CFG.mo * 30 * 24 * 3600 * 1000;
  let guard = 0;

  while(cur < Date.now() && guard < 200){
    guard++;
    try {
      const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${CFG.sym}&interval=${CFG.tf}&startTime=${cur}&limit=1000`);
      const d = await r.json();
      if(!d.length) break;
      all = all.concat(d.map(x => ({
        time: Math.floor(x[0] / 1000),
        open: +x[1],
        high: +x[2],
        low: +x[3],
        close: +x[4]
      })));
      document.getElementById('ld').textContent = 'Yuklanmoqda... ' + all.length + ' sham';
      cur = d[d.length - 1][0] + 1;
      if(d.length < 1000) break;
    } catch(e){ break; }
  }

  // Dublikatni o'chirish
  const seen = new Set();
  return all.filter(x => {
    if(seen.has(x.time)) return false;
    seen.add(x.time);
    return true;
  });
}

// ============================================================
// PIP SIZE
// ============================================================
function pipSize(s){
  if(s === 'BTCUSDT') return 1;
  if(s === 'ETHUSDT') return 0.5;
  if(s === 'BNBUSDT') return 0.1;
  if(s === 'SOLUSDT') return 0.01;
  if(s === 'XRPUSDT') return 0.001;
  return 0.01;
}

// ============================================================
// DINAMIK RR
// ============================================================
function dynRR(c){
  const body = Math.abs(c.close - c.open);
  const range = c.high - c.low;
  if(range <= 0) return 2;
  const x = body / range;
  if(x >= 0.85) return 5;
  if(x >= 0.70) return 3;
  if(x >= 0.55) return 2;
  return 1.5;
}

// ============================================================
// 1 SHAM 2 SHAMNI YUTADI (ASOSIY SIGNAL)
// ============================================================
// prev2 = 2 sham oldin, prev1 = 1 sham oldin, cur = signal sham
function isBull(p2, p1, c){
  // cur YASHIL
  if(c.close <= c.open) return false;
  // prev1 va prev2 QIZIL
  if(p1.close >= p1.open) return false;
  if(p2.close >= p2.open) return false;

  // 2 qizil shamning eng YUQORI HIGH va eng PAST LOW
  const maxHigh = Math.max(p1.high, p2.high);
  const minLow  = Math.min(p1.low, p2.low);

  // Yashil sham TO'LIQ yutadi (wick + body)
  return c.low <= minLow && c.close > maxHigh;
}

function isBear(p2, p1, c){
  // cur QIZIL
  if(c.close >= c.open) return false;
  // prev1 va prev2 YASHIL
  if(p1.close <= p1.open) return false;
  if(p2.close <= p2.open) return false;

  const maxHigh = Math.max(p1.high, p2.high);
  const minLow  = Math.min(p1.low, p2.low);

  // Qizil sham TO'LIQ yutadi
  return c.high >= maxHigh && c.close < minLow;
}

// ============================================================
// SAVDOLARNI HISOBLASH (COOLDOWN YO'Q)
// ============================================================
function calcTrades(cd){
  const trades = [];
  const ps = pipSize(CFG.sym);
  const buf = CFG.slBuf * ps;

  let bal = CFG.bal;
  let pos = null;
  let lastResult = -1;

  for(let i = 3; i < cd.length; i++){
    const now = cd[i].time;

    // ===== POZITSIYANI YOPISH =====
    if(pos){
      const c = cd[i];
      let exit = 0, res = null;

      if(pos.type === 'B'){
        if(c.low <= pos.sl){ exit = pos.sl; res = 'L'; }
        else if(c.high >= pos.tp){ exit = pos.tp; res = 'W'; }
      } else {
        if(c.high >= pos.sl){ exit = pos.sl; res = 'L'; }
        else if(c.low <= pos.tp){ exit = pos.tp; res = 'W'; }
      }

      if(res){
        if(res === 'W'){
          pos.pnl = pos.riskMoney * pos.rr;
          lastResult = 1;
        } else {
          pos.pnl = -pos.riskMoney;
          lastResult = 0;
        }
        bal += pos.pnl;
        pos.pips = Math.abs(pos.type === 'B' ? (exit - pos.entry) / ps : (pos.entry - exit) / ps);
        pos.result = res;
        pos.exit = exit;
        trades.push(pos);
        pos = null;
      }
    }

    if(pos) continue;

    // ===== SIGNAL (cooldown yo'q — har shamda tekshiriladi) =====
    const idx = i - 1;
    const c = cd[idx];
    const p1 = cd[idx - 1];
    const p2 = cd[idx - 2];
    if(!c || !p1 || !p2) continue;

    let type = null;

    if(isBull(p2, p1, c)){
      type = 'B';
    } else if(isBear(p2, p1, c)){
      type = 'S';
    }

    if(!type) continue;

    // ===== SL: 2 shamning ekstremumi =====
    let slPrice, slDist;
    if(type === 'B'){
      slPrice = Math.min(p1.low, p2.low) - buf;
      slDist = c.close - slPrice;
    } else {
      slPrice = Math.max(p1.high, p2.high) + buf;
      slDist = slPrice - c.close;
    }
    if(slDist <= 0) continue;

    // ===== DINAMIK RR =====
    const rr = dynRR(c);

    // ===== TP =====
    const tp = type === 'B' ? c.close + slDist * rr : c.close - slDist * rr;

    // ===== RISK =====
    let rp = CFG.risk;
    if(lastResult === 0) rp *= 0.5;
    else if(lastResult === 1) rp *= 1.2;
    if(rp > 4) rp = 4;
    const riskMoney = bal * rp / 100;

    pos = {
      time: c.time,
      type,
      entry: c.close,
      sl: slPrice,
      tp,
      rr,
      slDist,
      riskMoney
    };
  }

  // ===== OXIRGI OCHIQ POZITSIYANI YOPISH =====
  if(pos){
    const last = cd[cd.length - 1];
    const exit = last.close;
    pos.pnl = pos.riskMoney * (pos.type === 'B' ? (exit - pos.entry) / pos.slDist : (pos.entry - exit) / pos.slDist);
    pos.pips = Math.abs((pos.type === 'B' ? (exit - pos.entry) : (pos.entry - exit)) / ps);
    pos.result = pos.pnl >= 0 ? 'W' : 'L';
    pos.exit = exit;
    trades.push(pos);
  }

  return trades;
}

// ============================================================
// STATISTIKA
// ============================================================
function stats(trades){
  let total = 0, wins = 0, losses = 0, gw = 0, gl = 0;

  trades.forEach(t => {
    if(t.result === 'W'){
      wins++; gw += t.pnl; total += t.pnl;
    } else if(t.result === 'L'){
      losses++; gl += Math.abs(t.pnl); total += t.pnl;
    }
  });

  const closed = wins + losses;
  const wr = closed > 0 ? wins / closed * 100 : 0;
  const pf = gl > 0 ? gw / gl : 0;

  const P = document.getElementById('pnl');
  P.textContent = (total >= 0 ? '+' : '') + total.toFixed(2) + '$';
  P.className = total > 0 ? 'g' : total < 0 ? 'r2' : '';

  const W = document.getElementById('wr');
  W.textContent = wr.toFixed(1) + '%';
  W.className = wr >= 50 ? 'g' : wr > 0 ? 'r2' : '';

  document.getElementById('w').textContent = wins;
  document.getElementById('l').textContent = losses;
  document.getElementById('pf').textContent = pf.toFixed(2);
  document.getElementById('tt').textContent = closed;
  document.getElementById('lc').textContent = trades.length;

  // Log
  const L = document.getElementById('lst');
  if(!trades.length){
    L.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8">Signal yo\'q</div>';
    return;
  }

  L.innerHTML = trades.slice(-30).reverse().map(t => {
    const d = new Date(t.time * 1000);
    const ts = String(d.getDate()).padStart(2,'0') + '.' +
               String(d.getMonth()+1).padStart(2,'0') + ' ' +
               String(d.getHours()).padStart(2,'0') + ':' +
               String(d.getMinutes()).padStart(2,'0');
    const fmt = v => v < 1 ? v.toFixed(4) : v < 100 ? v.toFixed(2) : v.toFixed(0);
    const rc = t.result === 'W' ? 'w' : 'l';
    const rt = t.result === 'W' ? '+' + (t.riskMoney * t.rr).toFixed(1) + '$' : '-' + t.riskMoney.toFixed(1) + '$';
    return `<div class="li">
      <span class="t">${ts}</span>
      <span class="sb ${t.type === 'B' ? 'b' : 's'}">${t.type === 'B' ? 'BUY' : 'SELL'}</span>
      <span class="p">@${fmt(t.entry)} · RR 1:${t.rr}</span>
      <span class="rr ${rc}">${rt}</span>
    </div>`;
  }).join('');
}

// ============================================================
// ASOSIY YUKLASH
// ============================================================
async function load(){
  const ld = document.getElementById('ld');
  const st = document.getElementById('st');
  ld.classList.remove('x');
  ld.textContent = 'Yuklanmoqda...';
  st.textContent = '...';

  try {
    const cd = await fetchCandles();
    if(!cd.length) throw new Error('Ma\'lumot yo\'q');

    series.setData(cd);
    const trades = calcTrades(cd);

    // Markerlar
    const markers = trades.map(t => ({
      time: t.time,
      position: t.type === 'B' ? 'belowBar' : 'aboveBar',
      color: t.result === 'W' ? '#10b981' : '#ef4444',
      shape: t.type === 'B' ? 'arrowUp' : 'arrowDown',
      text: t.type === 'B' ? 'BUY' : 'SELL'
    }));
    series.setMarkers(markers);

    stats(trades);
    chart.timeScale().fitContent();
    ld.classList.add('x');
    st.textContent = '✅ ' + CFG.sym + ' ' + CFG.tf + ' · ' + trades.length + ' savdo';
  } catch(e){
    ld.textContent = '⚠️ ' + e.message;
    st.textContent = 'Xato';
  }
}

// ============================================================
// BOSHLASH
// ============================================================
initChart();
load();
</script>
</body>
</html>
