<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Engulfing · Flat PA</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0b0f;color:#e2e8f0}
.h{padding:10px 14px;background:#131620;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}
.h b{font-size:13px}
.st{font-size:10px;padding:4px 10px;border-radius:10px;background:#10b98122;color:#6ee7b7}
.c{padding:8px 12px;background:#131620;border-bottom:1px solid #ffffff14;display:flex;gap:5px;overflow-x:auto}
.c::-webkit-scrollbar{display:none}
.b{padding:6px 12px;background:#1a1e2e;border:1px solid #ffffff1f;border-radius:6px;font-size:11px;color:#94a3b8;font-weight:600;cursor:pointer;white-space:nowrap}
.b.on{background:#334155;color:#fff;border-color:#94a3b8}
#ch{height:55vh;background:#0a0b0f;position:relative}
.ld{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#0a0b0fee;font-size:12px;color:#94a3b8}
.ld.x{display:none}
.s{padding:12px;background:#131620}
.r{display:flex;gap:8px;margin-bottom:8px}
.k{flex:1;padding:10px;background:#1a1e2e;border-radius:10px;text-align:center}
.k i{font-size:9px;color:#94a3b8;text-transform:uppercase;font-style:normal;display:block;margin-bottom:4px}
.k b{font-size:20px;font-weight:700}
.g{color:#6ee7b7}.r2{color:#fca5a5}.o{color:#fbbf24}
.m{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:8px}
.m div{padding:7px;background:#1a1e2e;border-radius:8px;text-align:center;font-size:10px;color:#94a3b8}
.m div b{display:block;font-size:13px;color:#e2e8f0;margin-top:3px}
.ctrl{padding:8px 12px;background:#1a1e2e;border-radius:8px;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:#94a3b8;align-items:center}
.ctrl input{width:52px;padding:4px 6px;background:#0a0b0f;border:1px solid #ffffff1f;border-radius:5px;color:#e2e8f0;font-size:10px;font-family:monospace;text-align:center}
.hd{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;text-transform:uppercase;margin-bottom:5px}
.lst{max-height:200px;overflow-y:auto;background:#1a1e2e;border-radius:8px}
.lst::-webkit-scrollbar{width:3px}
.lst::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:2px}
.li{display:grid;grid-template-columns:56px 38px 1fr 72px;gap:5px;padding:7px 8px;border-bottom:1px solid #ffffff0d;font-family:monospace;font-size:10px;align-items:center}
.li:last-child{border:0}
.li .t{color:#94a3b8;font-size:9px}
.sb{font-weight:700;padding:2px 5px;border-radius:4px;text-align:center;font-size:8px}
.sb.b{background:#10b98133;color:#6ee7b7}
.sb.s{background:#ef444433;color:#fca5a5}
.li .p{color:#cbd5e1;font-size:9px}
.li .rr{text-align:right;font-weight:700}
.li .rr.w{color:#6ee7b7}.li .rr.l{color:#fca5a5}.li .rr.be{color:#fbbf24}
.lot-badge{display:inline-block;background:#334155;color:#e2e8f0;padding:1px 4px;border-radius:3px;font-size:8px;margin-left:3px}
</style>
</head>
<body>

<div class="h"><b>🎯 Engulfing · Flat PA</b><div class="st" id="st">...</div></div>

<div class="c">
<div class="b on" onclick="S(this,'s','BTCUSDT')">BTC</div>
<div class="b" onclick="S(this,'s','ETHUSDT')">ETH</div>
<div class="b" onclick="S(this,'s','BNBUSDT')">BNB</div>
<div class="b" onclick="S(this,'s','SOLUSDT')">SOL</div>
<div style="width:1px;background:#ffffff1f;margin:0 4px"></div>
<div class="b on" onclick="S(this,'t','5m')">M5</div>
<div class="b" onclick="S(this,'t','15m')">M15</div>
<div class="b" onclick="S(this,'t','1h')">H1</div>
<div class="b" onclick="S(this,'t','4h')">H4</div>
</div>

<div id="ch"><div class="ld" id="ld">Yuklanmoqda...</div></div>

<div class="s">
<div class="r">
<div class="k"><i>💰 P&L</i><b id="pnl">0</b></div>
<div class="k"><i>🎯 Win Rate</i><b id="wr">0%</b></div>
</div>
<div class="m">
<div>✅ Win<b id="w">0</b></div>
<div>❌ Loss<b id="l">0</b></div>
<div>📈 PF<b id="pf">0</b></div>
<div>📊 Jami<b id="tt">0</b></div>
</div>
<div class="ctrl">
<span>Balans:</span><input type="number" id="balInput" value="1000" step="100" onchange="load()">
<span>SLbuf:</span><input type="number" id="slBufInput" value="10" step="5" onchange="load()">
<span>Lot start:</span><input type="number" id="lotStart" value="0.05" step="0.01" onchange="load()">
<span>Lot cap:</span><input type="number" id="lotCap" value="0.50" step="0.05" onchange="load()">
<span>Flat%:</span><input type="number" id="flatPct" value="1.5" step="0.1" onchange="load()">
</div>
<div class="hd"><span>📋 Savdolar (Flat + Structure + Engulfing)</span><span id="lc">0</span></div>
<div class="lst" id="lst"><div style="padding:20px;text-align:center;color:#94a3b8">Kutilmoqda...</div></div>
</div>

<script>
// ============================================================
// SOZLAMALAR
// ============================================================
const CFG = { sym: 'BTCUSDT', tf: '5m', mo: 3 };

function getBal(){ return parseFloat(document.getElementById('balInput').value) || 1000; }
function getSLBuf(){ return parseFloat(document.getElementById('slBufInput').value) || 10; }
function getLotStart(){ return parseFloat(document.getElementById('lotStart').value) || 0.05; }
function getLotCap(){ return parseFloat(document.getElementById('lotCap').value) || 0.50; }
function getFlatPct(){ return parseFloat(document.getElementById('flatPct').value) / 100 || 0.015; }

let chart, series, flatLine;

function S(el, type, val){
  el.parentNode.querySelectorAll('.b').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  if(type === 's') CFG.sym = val;
  if(type === 't') CFG.tf = val;
  load();
}

// ============================================================
// CHART
// ============================================================
function initChart(){
  const el = document.getElementById('ch');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight,
    layout: { background: { color: '#0a0b0f' }, textColor: '#cbd5e1', fontSize: 10 },
    grid: { vertLines: { color: '#ffffff0a' }, horzLines: { color: '#ffffff0a' } },
    rightPriceScale: { borderColor: '#ffffff14' },
    timeScale: { borderColor: '#ffffff14', timeVisible: true }
  });
  series = chart.addCandlestickSeries({
    upColor: '#10b981', downColor: '#ef4444',
    borderUpColor: '#10b981', borderDownColor: '#ef4444',
    wickUpColor: '#10b981', wickDownColor: '#ef4444'
  });
  window.addEventListener('resize', () => {
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  });
}

// ============================================================
// MA'LUMOT
// ============================================================
async function fetchCandles(){
  let all = [];
  let cur = Date.now() - CFG.mo * 30 * 24 * 3600 * 1000;
  let guard = 0;
  while(cur < Date.now() && guard < 200){
    guard++;
    try {
      const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${CFG.sym}&interval=${CFG.tf}&startTime=${cur}&limit=1000`);
      const d = await r.json();
      if(!d.length) break;
      all = all.concat(d.map(x => ({
        time: Math.floor(x[0]/1000), open: +x[1], high: +x[2], low: +x[3], close: +x[4]
      })));
      document.getElementById('ld').textContent = 'Yuklanmoqda... ' + all.length + ' sham';
      cur = d[d.length-1][0] + 1;
      if(d.length < 1000) break;
    } catch(e){ break; }
  }
  const seen = new Set();
  return all.filter(x => !seen.has(x.time) && seen.add(x.time));
}

// ============================================================
// FLAT ZONE DETECTION — Pure Price Action
// ============================================================
// Flat = oxirgi 30 sham range < X% narx
function isFlatZone(cd, idx){
  const lookback = 30;
  if(idx < lookback) return false;

  let hi = -Infinity, lo = Infinity;
  for(let i = idx - lookback + 1; i <= idx; i++){
    hi = Math.max(hi, cd[i].high);
    lo = Math.min(lo, cd[i].low);
  }
  const range = hi - lo;
  const price = cd[idx].close;
  const pct = range / price;

  return pct < getFlatPct();  // Flat agar range kichik bo'lsa
}

// ============================================================
// MARKET STRUCTURE — Local Swing High/Low
// ============================================================
function findSwingHigh(cd, from, to){
  let h = -Infinity, idx = -1;
  for(let i = from; i <= to && i < cd.length; i++){
    if(cd[i].high > h){ h = cd[i].high; idx = i; }
  }
  return { value: h, idx };
}
function findSwingLow(cd, from, to){
  let l = Infinity, idx = -1;
  for(let i = from; i <= to && i < cd.length; i++){
    if(cd[i].low < l){ l = cd[i].low; idx = i; }
  }
  return { value: l, idx };
}

// Structure break: narx oldingi swing high/low ni buzdi
function structureBreak(cd, idx, type){
  const lookback = 20;
  if(idx < lookback * 2) return false;

  if(type === 'bull'){
    // Oldingi swing high (idx-20 dan idx-5 gacha)
    const prevHigh = findSwingHigh(cd, idx - lookback, idx - 5);
    if(prevHigh.value === -Infinity) return false;
    // Hozirgi sham uning yuqorisini buzdi
    return cd[idx].close > prevHigh.value;
  } else {
    const prevLow = findSwingLow(cd, idx - lookback, idx - 5);
    if(prevLow.value === Infinity) return false;
    return cd[idx].close < prevLow.value;
  }
}

// ============================================================
// 2-CANDLE ENGULFING
// ============================================================
function isBull(p2, p1, c){
  if(c.close <= c.open) return false;
  if(p1.close >= p1.open) return false;
  if(p2.close >= p2.open) return false;
  const maxHigh = Math.max(p1.high, p2.high);
  const minLow  = Math.min(p1.low, p2.low);
  return c.low <= minLow && c.close > maxHigh;
}

function isBear(p2, p1, c){
  if(c.close >= c.open) return false;
  if(p1.close <= p1.open) return false;
  if(p2.close <= p2.open) return false;
  const maxHigh = Math.max(p1.high, p2.high);
  const minLow  = Math.min(p1.low, p2.low);
  return c.high >= maxHigh && c.close < minLow;
}

// ============================================================
// DINAMIK LOT — 0.05 → 0.50
// ============================================================
function getDynamicLot(wins){
  const start = getLotStart();
  const cap = getLotCap();
  const lot = start + Math.floor(wins / 10) * 0.05;
  return Math.min(lot, cap);
}

// ============================================================
// ASOSIY LOGIKA
// ============================================================
function calcTrades(cd){
  const trades = [];
  const buf = getSLBuf();
  const startBal = getBal();

  let bal = startBal;
  let pos = null;
  let wins = 0;
  let losses = 0;
  let bes = 0;

  for(let i = 5; i < cd.length; i++){
    const c = cd[i];

    // ===== POZITSIYA BOSHQARUVI =====
    if(pos){
      // SL tegilganini tekshirish
      let exit = 0, exitR = 0, closed = false;
      if(pos.type === 'B' && c.low <= pos.sl){
        exit = pos.sl;
        exitR = (exit - pos.entry) / pos.slDist;
        closed = true;
      } else if(pos.type === 'S' && c.high >= pos.sl){
        exit = pos.sl;
        exitR = (pos.entry - exit) / pos.slDist;
        closed = true;
      }

      if(closed){
        pos.pnl = exitR * pos.riskPerR;
        pos.exit = exit;
        pos.exitR = exitR;
        if(pos.pnl > 0.01){ pos.result = 'W'; wins++; }
        else if(pos.pnl < -0.01){ pos.result = 'L'; losses++; }
        else { pos.result = 'BE'; bes++; }
        bal += pos.pnl;
        trades.push(pos);
        pos = null;
      } else {
        // Trailing stop yangilash
        let maxR;
        if(pos.type === 'B') maxR = (c.high - pos.entry) / pos.slDist;
        else maxR = (pos.entry - c.low) / pos.slDist;

        if(maxR >= 1){
          const trailR = Math.floor(maxR) - 1;
          let newSL;
          if(pos.type === 'B'){
            newSL = pos.entry + trailR * pos.slDist;
            if(newSL > pos.sl) pos.sl = newSL;
          } else {
            newSL = pos.entry - trailR * pos.slDist;
            if(newSL < pos.sl) pos.sl = newSL;
          }
        }
      }
    }

    if(pos) continue;

    // ===== FLAT ZONE TEKSHIRUVI =====
    const idx = i - 1;
    if(!isFlatZone(cd, idx)) continue;

    const cl = cd[idx];
    const p1 = cd[idx - 1];
    const p2 = cd[idx - 2];
    if(!cl || !p1 || !p2) continue;

    // ===== ENGULFING + STRUCTURE BREAK =====
    let type = null;

    // BUY: 2-candle engulfing + Bullish structure break (HH)
    if(isBull(p2, p1, cl) && structureBreak(cd, idx, 'bull')){
      type = 'B';
    }
    // SELL: 2-candle engulfing + Bearish structure break (LL)
    else if(isBear(p2, p1, cl) && structureBreak(cd, idx, 'bear')){
      type = 'S';
    }

    if(!type) continue;

    // SL: 2 shamning ekstremumi
    let slPrice, slDist;
    if(type === 'B'){
      slPrice = Math.min(p1.low, p2.low) - buf * (cl.close / 100000);  // Dynamic buffer
      slDist = cl.close - slPrice;
    } else {
      slPrice = Math.max(p1.high, p2.high) + buf * (cl.close / 100000);
      slDist = slPrice - cl.close;
    }
    if(slDist <= 0) continue;

    // Dinamik lot
    const lot = getDynamicLot(wins);
    const riskPerR = lot * 100;

    pos = {
      time: cl.time,
      type,
      entry: cl.close,
      sl: slPrice,
      initialSL: slPrice,
      slDist,
      lot,
      riskPerR,
      inFlat: true
    };
  }

  // Oxirgi ochiq pozitsiya
  if(pos){
    const last = cd[cd.length - 1];
    const exit = last.close;
    let exitR;
    if(pos.type === 'B') exitR = (exit - pos.entry) / pos.slDist;
    else exitR = (pos.entry - exit) / pos.slDist;
    pos.pnl = exitR * pos.riskPerR;
    pos.exit = exit;
    pos.exitR = exitR;
    pos.manualClose = true;
    if(pos.pnl > 0.01){ pos.result = 'W'; wins++; }
    else if(pos.pnl < -0.01){ pos.result = 'L'; losses++; }
    else { pos.result = 'BE'; bes++; }
    trades.push(pos);
  }

  return { trades, wins, losses, bes, finalBal: bal };
}

// ============================================================
// STATISTIKA
// ============================================================
function stats(result){
  const trades = result.trades;
  let total = 0, w = 0, l = 0, be = 0, gw = 0, gl = 0;

  trades.forEach(t => {
    total += t.pnl;
    if(t.result === 'W'){ w++; gw += t.pnl; }
    else if(t.result === 'L'){ l++; gl += Math.abs(t.pnl); }
    else be++;
  });

  const closed = w + l + be;
  const wr = closed > 0 ? w / closed * 100 : 0;
  const pf = gl > 0 ? gw / gl : 0;

  const P = document.getElementById('pnl');
  P.textContent = (total >= 0 ? '+' : '') + total.toFixed(2) + '$';
  P.className = total > 0 ? 'g' : total < 0 ? 'r2' : '';

  const W = document.getElementById('wr');
  W.textContent = wr.toFixed(1) + '%';
  W.className = wr >= 50 ? 'g' : wr > 0 ? 'r2' : '';

  document.getElementById('w').textContent = w;
  document.getElementById('l').textContent = l;
  document.getElementById('pf').textContent = pf.toFixed(2);
  document.getElementById('tt').textContent = closed;
  document.getElementById('lc').textContent = trades.length;

  const L = document.getElementById('lst');
  if(!trades.length){
    L.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8">Flat + Engulfing signal yo\'q</div>';
    return;
  }

  L.innerHTML = trades.slice(-40).reverse().map(t => {
    const d = new Date(t.time * 1000);
    const ts = String(d.getDate()).padStart(2,'0') + '.' +
               String(d.getMonth()+1).padStart(2,'0') + ' ' +
               String(d.getHours()).padStart(2,'0') + ':' +
               String(d.getMinutes()).padStart(2,'0');
    const fmt = v => v < 1 ? v.toFixed(4) : v < 100 ? v.toFixed(2) : v.toFixed(0);
    const rc = t.result === 'W' ? 'w' : t.result === 'L' ? 'l' : 'be';
    const rt = (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(1) + '$';
    const rTxt = t.exitR !== undefined ? ` (${t.exitR >= 0 ? '+' : ''}${t.exitR.toFixed(1)}R)` : '';
    return `<div class="li">
      <span class="t">${ts}</span>
      <span class="sb ${t.type === 'B' ? 'b' : 's'}">${t.type === 'B' ? 'BUY' : 'SELL'}</span>
      <span class="p">@${fmt(t.entry)}<span class="lot-badge">${t.lot.toFixed(2)}</span>${rTxt}</span>
      <span class="rr ${rc}">${rt}</span>
    </div>`;
  }).join('');
}

// ============================================================
// ASOSIY
// ============================================================
async function load(){
  const ld = document.getElementById('ld');
  const st = document.getElementById('st');
  ld.classList.remove('x');
  ld.textContent = 'Yuklanmoqda...';
  st.textContent = '...';

  try {
    const cd = await fetchCandles();
    if(!cd.length) throw new Error('Ma\'lumot yo\'q');
    series.setData(cd);

    const result = calcTrades(cd);

    // Flat zone markerlari
    const markers = result.trades.map(t => ({
      time: t.time,
      position: t.type === 'B' ? 'belowBar' : 'aboveBar',
      color: t.result === 'W' ? '#10b981' : t.result === 'L' ? '#ef4444' : '#f59e0b',
      shape: t.type === 'B' ? 'arrowUp' : 'arrowDown',
      text: t.type === 'B' ? 'BUY' : 'SELL'
    }));
    series.setMarkers(markers);

    stats(result);
    chart.timeScale().fitContent();
    ld.classList.add('x');
    st.textContent = '✅ ' + CFG.sym + ' ' + CFG.tf + ' · ' + result.trades.length + ' savdo';
  } catch(e){
    ld.textContent = '⚠️ ' + e.message;
    st.textContent = 'Xato';
  }
}

initChart();
load();
</script>
</body>
</html>
