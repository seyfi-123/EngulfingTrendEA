<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Engulfing v2</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0b0f;color:#e2e8f0}
.h{padding:10px 14px;background:#131620;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}
.h b{font-size:13px}
.st{font-size:10px;padding:4px 10px;border-radius:10px;background:#10b98122;color:#6ee7b7}
.c{padding:8px 12px;background:#131620;border-bottom:1px solid #ffffff14;display:flex;gap:5px;overflow-x:auto}
.c::-webkit-scrollbar{display:none}
.b{padding:6px 12px;background:#1a1e2e;border:1px solid #ffffff1f;border-radius:6px;font-size:11px;color:#94a3b8;font-weight:600;cursor:pointer;white-space:nowrap}
.b.on{background:#334155;color:#fff;border-color:#94a3b8}
#ch{height:55vh;background:#0a0b0f;position:relative}
.ld{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#0a0b0fee;font-size:12px;color:#94a3b8}
.ld.x{display:none}
.s{padding:12px;background:#131620}
.r{display:flex;gap:8px;margin-bottom:8px}
.k{flex:1;padding:10px;background:#1a1e2e;border-radius:10px;text-align:center}
.k i{font-size:9px;color:#94a3b8;text-transform:uppercase;font-style:normal;display:block;margin-bottom:4px}
.k b{font-size:20px;font-weight:700}
.g{color:#6ee7b7}.r2{color:#fca5a5}
.m{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:8px}
.m div{padding:7px;background:#1a1e2e;border-radius:8px;text-align:center;font-size:10px;color:#94a3b8}
.m div b{display:block;font-size:13px;color:#e2e8f0;margin-top:3px}
.ctrl{padding:8px 12px;background:#1a1e2e;border-radius:8px;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:#94a3b8;align-items:center}
.ctrl input{width:50px;padding:4px 6px;background:#0a0b0f;border:1px solid #ffffff1f;border-radius:5px;color:#e2e8f0;font-size:10px;font-family:monospace;text-align:center}
.hd{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;text-transform:uppercase;margin-bottom:5px}
.lst{max-height:180px;overflow-y:auto;background:#1a1e2e;border-radius:8px}
.lst::-webkit-scrollbar{width:3px}
.lst::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:2px}
.li{display:grid;grid-template-columns:58px 38px 1fr 68px;gap:5px;padding:7px 8px;border-bottom:1px solid #ffffff0d;font-family:monospace;font-size:10px;align-items:center}
.li:last-child{border:0}
.li .t{color:#94a3b8}
.sb{font-weight:700;padding:2px 5px;border-radius:4px;text-align:center;font-size:8px}
.sb.b{background:#10b98133;color:#6ee7b7}
.sb.s{background:#ef444433;color:#fca5a5}
.li .p{color:#cbd5e1}
.li .rr{text-align:right;font-weight:700}
.li .rr.w{color:#6ee7b7}.li .rr.l{color:#fca5a5}
</style>
</head>
<body>

<div class="h"><b>🎯 Engulfing v2</b><div class="st" id="st">...</div></div>

<div class="c">
<div class="b on" onclick="S(this,'s','BTCUSDT')">BTC</div>
<div class="b" onclick="S(this,'s','ETHUSDT')">ETH</div>
<div class="b" onclick="S(this,'s','BNBUSDT')">BNB</div>
<div class="b" onclick="S(this,'s','SOLUSDT')">SOL</div>
<div style="width:1px;background:#ffffff1f;margin:0 4px"></div>
<div class="b" onclick="S(this,'t','5m')">M5</div>
<div class="b on" onclick="S(this,'t','15m')">M15</div>
<div class="b" onclick="S(this,'t','1h')">H1</div>
</div>

<div id="ch"><div class="ld" id="ld">Yuklanmoqda...</div></div>

<div class="s">
<div class="r">
<div class="k"><i>💰 P&L</i><b id="pnl">0</b></div>
<div class="k"><i>🎯 WR</i><b id="wr">0%</b></div>
</div>
<div class="m">
<div>✅ Win<b id="w">0</b></div>
<div>❌ Loss<b id="l">0</b></div>
<div>📈 PF<b id="pf">0</b></div>
<div>📊 Jami<b id="tt">0</b></div>
</div>
<div class="ctrl">
<span>Risk%:</span><input type="number" id="riskInput" value="3" step="0.5" min="0.5" max="10" onchange="load()">
<span>SLbuf:</span><input type="number" id="slBufInput" value="10" step="5" onchange="load()">
<span>Trend MA:</span><input type="number" id="trendMA" value="50" step="10" onchange="load()">
</div>
<div class="hd"><span>📋 Savdolar</span><span id="lc">0</span></div>
<div class="lst" id="lst"><div style="padding:20px;text-align:center;color:#94a3b8">Kutilmoqda...</div></div>
</div>

<script>
// ============================================================
// SOZLAMALAR — 1 oy default
// ============================================================
const CFG = {
  sym: 'BTCUSDT',
  tf: '15m',
  mo: 1,          // 1 OY
  bal: 1000,
  maxRisk: 5      // Max risk chegarasi
};

function getRisk(){ return parseFloat(document.getElementById('riskInput').value) || 3; }
function getSLBuf(){ return parseFloat(document.getElementById('slBufInput').value) || 10; }
function getTrendMA(){ return parseInt(document.getElementById('trendMA').value) || 50; }

let chart, series;

function S(el, type, val){
  el.parentNode.querySelectorAll('.b').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  if(type === 's') CFG.sym = val;
  if(type === 't') CFG.tf = val;
  load();
}

// ============================================================
// CHART
// ============================================================
function initChart(){
  const el = document.getElementById('ch');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: el.clientHeight,
    layout: { background: { color: '#0a0b0f' }, textColor: '#cbd5e1', fontSize: 10 },
    grid: { vertLines: { color: '#ffffff0a' }, horzLines: { color: '#ffffff0a' } },
    rightPriceScale: { borderColor: '#ffffff14' },
    timeScale: { borderColor: '#ffffff14', timeVisible: true }
  });
  series = chart.addCandlestickSeries({
    upColor: '#10b981', downColor: '#ef4444',
    borderUpColor: '#10b981', borderDownColor: '#ef4444',
    wickUpColor: '#10b981', wickDownColor: '#ef4444'
  });
  window.addEventListener('resize', () => {
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  });
}

// ============================================================
// MA'LUMOT
// ============================================================
async function fetchCandles(){
  let all = [];
  let cur = Date.now() - CFG.mo * 30 * 24 * 3600 * 1000;
  let guard = 0;
  while(cur < Date.now() && guard < 200){
    guard++;
    try {
      const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${CFG.sym}&interval=${CFG.tf}&startTime=${cur}&limit=1000`);
      const d = await r.json();
      if(!d.length) break;
      all = all.concat(d.map(x => ({
        time: Math.floor(x[0]/1000),
        open: +x[1], high: +x[2], low: +x[3], close: +x[4]
      })));
      document.getElementById('ld').textContent = 'Yuklanmoqda... ' + all.length + ' sham';
      cur = d[d.length-1][0] + 1;
      if(d.length < 1000) break;
    } catch(e){ break; }
  }
  const seen = new Set();
  return all.filter(x => !seen.has(x.time) && seen.add(x.time));
}

// ============================================================
// YORDAMCHI
// ============================================================
function pipSize(s){
  if(s === 'BTCUSDT') return 1;
  if(s === 'ETHUSDT') return 0.5;
  if(s === 'BNBUSDT') return 0.1;
  if(s === 'SOLUSDT') return 0.01;
  if(s === 'XRPUSDT') return 0.001;
  return 0.01;
}

function dynRR(c){
  const body = Math.abs(c.close - c.open);
  const range = c.high - c.low;
  if(range <= 0) return 2;
  const x = body / range;
  if(x >= 0.85) return 5;
  if(x >= 0.70) return 3;
  if(x >= 0.55) return 2;
  return 1.5;
}

// MA hisoblash
function calcMA(cd, period, idx){
  if(idx < period) return null;
  let sum = 0;
  for(let i = idx - period + 1; i <= idx; i++) sum += cd[i].close;
  return sum / period;
}

// ============================================================
// SIGNAL — 1 sham 2 shamni TO'LIQ yutadi
// ============================================================
function isBull(p2, p1, c){
  if(c.close <= c.open) return false;
  if(p1.close >= p1.open) return false;
  if(p2.close >= p2.open) return false;
  const maxHigh = Math.max(p1.high, p2.high);
  const minLow  = Math.min(p1.low, p2.low);
  return c.low <= minLow && c.close > maxHigh;
}

function isBear(p2, p1, c){
  if(c.close >= c.open) return false;
  if(p1.close <= p1.open) return false;
  if(p2.close <= p2.open) return false;
  const maxHigh = Math.max(p1.high, p2.high);
  const minLow  = Math.min(p1.low, p2.low);
  return c.high >= maxHigh && c.close < minLow;
}

// ============================================================
// ASOSIY LOGIKA — BEP + TRAILING
// ============================================================
function calcTrades(cd){
  const trades = [];
  const ps = pipSize(CFG.sym);
  const buf = getSLBuf() * ps;
  const maPeriod = getTrendMA();

  let bal = CFG.bal;
  let pos = null;
  let lastResult = -1;

  for(let i = 3; i < cd.length; i++){
    const c = cd[i];

    // ===== POZITSIYA BOSHQARUVI =====
    if(pos){
      // 1. Break-even: 1R foyda bo'lsa → SL = entry
      if(!pos.beDone){
        if(pos.type === 'B'){
          const profitR = (c.high - pos.entry) / pos.slDist;
          if(profitR >= 1){
            pos.sl = pos.entry + 5 * ps;  // Entry + 5 pips
            pos.beDone = true;
          }
        } else {
          const profitR = (pos.entry - c.low) / pos.slDist;
          if(profitR >= 1){
            pos.sl = pos.entry - 5 * ps;
            pos.beDone = true;
          }
        }
      }

      // 2. Trailing SL: 2R foyda → SL = entry + 1R
      if(pos.beDone && !pos.trailDone){
        if(pos.type === 'B'){
          const profitR = (c.high - pos.entry) / pos.slDist;
          if(profitR >= 2){
            pos.sl = pos.entry + pos.slDist * 1;
            pos.trailDone = true;
          }
        } else {
          const profitR = (pos.entry - c.low) / pos.slDist;
          if(profitR >= 2){
            pos.sl = pos.entry - pos.slDist * 1;
            pos.trailDone = true;
          }
        }
      }

      // 3. SL/TP tekshirish
      let exit = 0, res = null;
      if(pos.type === 'B'){
        if(c.low <= pos.sl){ exit = pos.sl; res = 'L'; }
        else if(c.high >= pos.tp){ exit = pos.tp; res = 'W'; }
      } else {
        if(c.high >= pos.sl){ exit = pos.sl; res = 'L'; }
        else if(c.low <= pos.tp){ exit = pos.tp; res = 'W'; }
      }

      if(res){
        // P&L hisoblash
        if(pos.type === 'B'){
          const gained = exit - pos.entry;
          pos.pnl = pos.riskMoney * (gained / pos.slDist);
        } else {
          const gained = pos.entry - exit;
          pos.pnl = pos.riskMoney * (gained / pos.slDist);
        }

        // Natija
        if(pos.pnl > 0.01){
          pos.result = 'W';
          lastResult = 1;
        } else if(pos.pnl < -0.01){
          pos.result = 'L';
          lastResult = 0;
        } else {
          pos.result = 'BE';  // Breakeven
          lastResult = 0;
        }

        bal += pos.pnl;
        pos.exit = exit;
        trades.push(pos);
        pos = null;
      }
    }

    if(pos) continue;

    // ===== YANGI SIGNAL =====
    const idx = i - 1;
    const cl = cd[idx];
    const p1 = cd[idx - 1];
    const p2 = cd[idx - 2];
    if(!cl || !p1 || !p2) continue;

    // Trend MA
    const ma = calcMA(cd, maPeriod, idx);
    if(!ma) continue;

    let type = null;
    if(isBull(p2, p1, cl) && cl.close > ma){      // Faqat trend bo'ylab
      type = 'B';
    } else if(isBear(p2, p1, cl) && cl.close < ma){
      type = 'S';
    }
    if(!type) continue;

    // SL
    let slPrice, slDist;
    if(type === 'B'){
      slPrice = Math.min(p1.low, p2.low) - buf;
      slDist = cl.close - slPrice;
    } else {
      slPrice = Math.max(p1.high, p2.high) + buf;
      slDist = slPrice - cl.close;
    }
    if(slDist <= 0) continue;

    // RR
    const rr = dynRR(cl);
    const tp = type === 'B' ? cl.close + slDist * rr : cl.close - slDist * rr;

    // Risk
    let rp = getRisk();
    if(lastResult === 0) rp *= 0.5;
    else if(lastResult === 1) rp *= 1.3;
    if(rp > CFG.maxRisk) rp = CFG.maxRisk;
    const riskMoney = bal * rp / 100;

    pos = {
      time: cl.time, type, entry: cl.close,
      sl: slPrice, tp, rr, slDist, riskMoney,
      beDone: false, trailDone: false
    };
  }

  return trades;
}

// ============================================================
// STATISTIKA
// ============================================================
function stats(trades){
  let total = 0, wins = 0, losses = 0, be = 0, gw = 0, gl = 0;
  trades.forEach(t => {
    if(t.result === 'W'){ wins++; gw += t.pnl; total += t.pnl; }
    else if(t.result === 'L'){ losses++; gl += Math.abs(t.pnl); total += t.pnl; }
    else be++;
  });

  const closed = wins + losses + be;
  const wr = closed > 0 ? wins / closed * 100 : 0;
  const pf = gl > 0 ? gw / gl : 0;

  const P = document.getElementById('pnl');
  P.textContent = (total >= 0 ? '+' : '') + total.toFixed(2) + '$';
  P.className = total > 0 ? 'g' : total < 0 ? 'r2' : '';

  const W = document.getElementById('wr');
  W.textContent = wr.toFixed(1) + '%';
  W.className = wr >= 50 ? 'g' : wr > 0 ? 'r2' : '';

  document.getElementById('w').textContent = wins;
  document.getElementById('l').textContent = losses;
  document.getElementById('pf').textContent = pf.toFixed(2);
  document.getElementById('tt').textContent = closed;
  document.getElementById('lc').textContent = trades.length;

  const L = document.getElementById('lst');
  if(!trades.length){
    L.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8">Signal yo\'q</div>';
    return;
  }

  L.innerHTML = trades.slice(-40).reverse().map(t => {
    const d = new Date(t.time * 1000);
    const ts = String(d.getDate()).padStart(2,'0') + '.' +
               String(d.getMonth()+1).padStart(2,'0') + ' ' +
               String(d.getHours()).padStart(2,'0') + ':' +
               String(d.getMinutes()).padStart(2,'0');
    const fmt = v => v < 1 ? v.toFixed(4) : v < 100 ? v.toFixed(2) : v.toFixed(0);
    const rc = t.result === 'W' ? 'w' : t.result === 'L' ? 'l' : '';
    const rt = (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(1) + '$';
    return `<div class="li">
      <span class="t">${ts}</span>
      <span class="sb ${t.type === 'B' ? 'b' : 's'}">${t.type === 'B' ? 'BUY' : 'SELL'}</span>
      <span class="p">@${fmt(t.entry)} · RR 1:${t.rr}${t.beDone ? ' · BE' : ''}</span>
      <span class="rr ${rc}">${rt}</span>
    </div>`;
  }).join('');
}

// ============================================================
// ASOSIY
// ============================================================
async function load(){
  const ld = document.getElementById('ld');
  const st = document.getElementById('st');
  ld.classList.remove('x');
  ld.textContent = 'Yuklanmoqda...';
  st.textContent = '...';

  try {
    const cd = await fetchCandles();
    if(!cd.length) throw new Error('Ma\'lumot yo\'q');
    series.setData(cd);
    const trades = calcTrades(cd);

    const markers = trades.map(t => ({
      time: t.time,
      position: t.type === 'B' ? 'belowBar' : 'aboveBar',
      color: t.result === 'W' ? '#10b981' : t.result === 'L' ? '#ef4444' : '#f59e0b',
      shape: t.type === 'B' ? 'arrowUp' : 'arrowDown',
      text: t.type === 'B' ? 'BUY' : 'SELL'
    }));
    series.setMarkers(markers);

    stats(trades);
    chart.timeScale().fitContent();
    ld.classList.add('x');
    st.textContent = '✅ ' + CFG.sym + ' ' + CFG.tf + ' · 1 oy · ' + trades.length + ' savdo';
  } catch(e){
    ld.textContent = '⚠️ ' + e.message;
    st.textContent = 'Xato';
  }
}

initChart();
load();
</script>
</body>
</html>
